        }

        .banner-box {
            position: relative;
            width: 100%;
            height: 180px;
            overflow: hidden;
            background: #000;
            display: block;
        }

        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .banner-box:hover .banner-img {
            transform: scale(1.04);
        }

        .badge-live {
            position: absolute;
            top: 12px;

            color: #fff;

            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.8);
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #00ff66; /* উজ্জ্বল নিয়ন সবুজ */
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff66;
            animation: pulse-green 1s infinite alternate;
        }

        @keyframes pulse-green {
            0% { 
                opacity: 0.3;
                transform: scale(0.8);
                box-shadow: 0 0 2px #00ff66;
            }
            100% { 
                opacity: 1;
                transform: scale(1.15);
                box-shadow: 0 0 10px #00ff66, 0 0 18px #00ff66;
            }
        }

        .logo-box {
            margin-top: -50px;
            position: relative;
            display: flex;
            justify-content: center;
            z-index: 2;
        }

        .logo-box img {

        .content {

        .title {

            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #ff3366, #ff6b6b, #ff9900);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 6px;
        }

        .subtitle {
            font-size: 13px;
            color: #d1d1d1;
            margin-top: 4px;
            margin-bottom: 18px;
            font-weight: 500;
        }

        .tags {

        .tag {

            border-radius: 10px;
            font-size: 11px;
            color: #ffb4c2;

        .btn-telegram {

            gap: 12px;
            background: linear-gradient(135deg, #0088cc, #229ED9);

            text-decoration: none;
            padding: 16px 20px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 25px rgba(34, 158, 217, 0.7);

        .btn-telegram:hover {

            box-shadow: 0 0 35px rgba(34, 158, 217, 1);

        .btn-telegram svg {
            width: 24px;

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(34, 158, 217, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(34, 158, 217, 0); }
